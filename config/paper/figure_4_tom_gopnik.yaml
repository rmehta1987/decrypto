defaults:
  - override hydra/job_logging: disabled

_target_: src.types.ExperimentConfig
num_episodes: 32
env_seed: [0,1,2]
verbose: false
baseline_data_dir: embedding_models/
exp_name: figure_4_tom_gopnik
gopnik: true
# fixed_encoder: qwen3_4b
fixed_encoder: llama3.1_70B  # eval target is the interceptor so we fix the encoder and decoder
# fixed_encoder: deepseek_r1_32B
# fixed_decoder: qwen3_4b
fixed_decoder: llama3.1_70B
# fixed_decoder: deepseek_r1_32B
fixed_interceptor: ""
filter_model: ""
confirm_include_api_models: true
no_error_history: true
